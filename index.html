<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            align-items: center;
            display: flex;
            flex-direction: column;
        }
 .box1{
    height: 300px;
    width: 500px;
    border: 1px solid black;
    background-color: aqua;
    position: relative;
 }
 .box1:hover + .box2{
    background-color: blue;
    display: block;
 }
 .box2{
        height: 100px;
    width: 100px;
    border: 1px solid black;
    background-color: red;
    position: absolute;
    bottom: 0%;
    display: none;

 }


    </style>
</head>
<body>
   <div class="box1"></div>
   <div class="box2"></div>
</body>
</html>
